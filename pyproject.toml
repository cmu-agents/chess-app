[project]
name = "chess-app"
version = "0.1.0"
description = "Playable chess game and HTTP API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "python-chess>=1.999",
    "uvicorn[standard]>=0.40.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28.0", "pytest>=8.0"]

[project.scripts]
chess-server = "chess_app.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_app"]
